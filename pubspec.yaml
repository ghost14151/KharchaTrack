name: kharchatrack
description: Simple offline expense tracker.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  file_picker: ^13.3.3
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

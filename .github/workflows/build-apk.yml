name: Build KharchaTrack APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KHARCHATRACK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing KHARCHATRACK_KEYSTORE_BASE64 secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/kharchatrack-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KHARCHATRACK_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        env:
          KHARCHATRACK_KEYSTORE_PASSWORD: ${{ secrets.KHARCHATRACK_KEYSTORE_PASSWORD }}
          KHARCHATRACK_KEY_ALIAS: ${{ secrets.KHARCHATRACK_KEY_ALIAS }}
          KHARCHATRACK_KEY_PASSWORD: ${{ secrets.KHARCHATRACK_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          apksigner verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KharchaTrack-release
          path: build/app/outputs/flutter-apk/app-release.apk
